name: mow_events
description: "A new Flutter project."

publish_to: "none"

version: 1.3.0+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Utility Packages
  http: ^1.2.1
  intl: ^0.20.2
  logger: ^2.2.0
  url_launcher: ^6.2.6
  flutter_native_splash: ^2.4.0
  smooth_page_indicator: ^1.1.0
  connectivity_plus: ^6.0.3
  lottie: ^3.1.0
  table_calendar: ^3.2.0
  hijri: ^3.0.0
  hijri_calendar: ^1.0.7+7
  image_picker: ^1.0.4
  photo_view: ^0.15.0

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.6

  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  capped_progress_indicator: ^0.0.2

  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  # flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.4.1
  intl_phone_number_input: ^0.7.4
  permission_handler: ^12.0.1
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.0
  # pushy_flutter: ^2.0.40
  flutter_colorpicker: ^1.1.0

  # android_alarm_manager_plus: ^5.0.0
  timezone: ^0.10.1
  audioplayers: ^6.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  #--------------- LOCAL ASSETS ------------------#

  assets:
    - assets/
    - assets/images/animated/
    - assets/images/content/
    - assets/images/logo/
    - assets/images/icons/
    - assets/sounds/

  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: Arabic
      fonts:
        - asset: assets/font/arabic/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/font/arabic/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/arabic/Tajawal-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/logo.png"
